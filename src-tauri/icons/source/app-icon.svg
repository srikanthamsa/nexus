<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bg" x1="190" y1="100" x2="850" y2="930" gradientUnits="userSpaceOnUse">
      <stop stop-color="#181B27"/>
      <stop offset="0.55" stop-color="#0D0F16"/>
      <stop offset="1" stop-color="#07080C"/>
    </linearGradient>
    <linearGradient id="edge" x1="130" y1="100" x2="900" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B7CFF" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#C084FC" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6EE7F9" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="chevron" x1="360" y1="360" x2="670" y2="670" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C9C2FF"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#E9D5FF"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 480) rotate(90) scale(330)">
      <stop stop-color="#8B7CFF" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#8B7CFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 210) rotate(35) scale(560)">
      <stop stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="drop" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <rect x="88" y="88" width="848" height="848" rx="210" fill="url(#bg)"/>
    <rect x="90" y="90" width="844" height="844" rx="208" stroke="url(#edge)" stroke-width="4"/>
  </g>

  <rect x="88" y="88" width="848" height="848" rx="210" fill="url(#sheen)"/>
  <rect x="88" y="88" width="848" height="848" rx="210" fill="url(#halo)"/>

  <circle cx="512" cy="512" r="286" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>

  <g filter="url(#soft)" opacity="0.6">
    <path d="M362 374 L524 512 L362 650" stroke="#8B7CFF" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M362 374 L524 512 L362 650" stroke="url(#chevron)" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M508 374 L670 512 L508 650" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
