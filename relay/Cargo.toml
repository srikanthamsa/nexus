[package]
name = "nexus-relay"
version = "0.1.0"
edition = "2021"
description = "Self-hostable rendezvous relay for Nexus direct sessions"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
